[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assembly/*"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/src/workers/*"
  [headers.values]
    Content-Type = "application/wasm"