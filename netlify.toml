[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev -- --host 0.0.0.0"
  targetPort = 5173
  port = 8888

# Edge Function für Discord Build Previews
[[edge_functions]]
  path = "/:hunter"
  function = "discord-preview"
  
# Cache-busting für WASM-Dateien
[[headers]]
  for = "*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.wasm"  
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=0, must-revalidate" 